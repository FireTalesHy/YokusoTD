<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>YokusoTD · La Porte des Oni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Yuji+Syuku&display=swap" rel="stylesheet">
<style>
/* VOICE: légende peinte, solennelle et ludique — un emaki animé.
   IDEA: rouleau de papier washi où l'encre sumi-e et la lumière des lanternes repoussent les Oni.
   PICTURE: le champ de bataille pixel-art éclairé par shader, plein écran 16:9.
   COLOUR and TYPE: encre #17101a, washi #f1e4c8, vermillon #d4402c, or #e2b24c ; Shippori Mincho + Yuji Syuku.
   LAYOUT: scène plein cadre, HUD dans la bande de ciel, menus en sceaux et rouleaux posés sur la carte. */
:root{color-scheme:dark;--ink:#17101a;--ink2:#2a1d28;--washi:#f1e4c8;--washi2:#d9c7a2;--red:#d4402c;--red2:#9c2a1f;--gold:#e2b24c;--jade:#7fe0d0}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0c080d;overflow:hidden;font:600 16px/1.4 "Shippori Mincho B1",serif;color:var(--washi);user-select:none;-webkit-user-select:none;touch-action:none}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#000}
#gl,#fb{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
#fb{display:none}
.hud{position:absolute;inset:0;pointer-events:none;font-size:clamp(12px,calc(var(--u)*1.55),22px);--bh:clamp(34px,calc(var(--u)*3.9),56px)}
.hud .btn,#card,#card *,#pausePanel,#pausePanel *{pointer-events:auto}
.hud.off{display:none}
.top{position:absolute;left:1.4%;right:1.4%;top:2.2%;display:flex;gap:calc(var(--u)*.8);align-items:flex-start}
.stat{display:flex;align-items:center;gap:.35em;height:var(--bh);padding:0 .8em 0 .55em;background:rgba(23,16,26,.78);border-radius:.35em 1.1em .4em 1em/1em .4em 1.1em .35em;box-shadow:inset 0 0 0 1px rgba(241,228,200,.14),0 .2em .6em rgba(0,0,0,.35);white-space:nowrap;font-variant-numeric:tabular-nums}
.stat b{font-weight:800;font-size:1.18em}
.stat i{font:normal 1.25em "Yuji Syuku",serif;color:var(--gold)}
.stat.hp i{color:#ff7a5e}
.stat small{opacity:.65;font-size:.78em}
.sp{flex:1}
.btn{appearance:none;border:0;cursor:pointer;color:var(--washi);font:inherit;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-width:var(--bh,44px);height:var(--bh,44px);padding:0 .7em;background:rgba(23,16,26,.78);border-radius:.4em 1em .5em .9em/.9em .5em 1em .4em;box-shadow:inset 0 0 0 1px rgba(241,228,200,.16);transition:transform .12s,filter .12s;white-space:nowrap}
.btn:hover{filter:brightness(1.18)}.btn:active{transform:scale(.94)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn svg{width:1.15em;height:1.15em;fill:currentColor}
.btn.red{background:linear-gradient(100deg,#b8321f,#d94a2e 45%,#c23a24);box-shadow:inset 0 -.25em 0 rgba(0,0,0,.25),0 .25em .8em rgba(212,64,44,.35);padding:0 1.1em;border-radius:.3em 1.6em .5em 1.3em/1.3em .45em 1.6em .3em}
.btn.gold{background:linear-gradient(100deg,#b88a2a,#e2b24c 50%,#c89a34);color:var(--ink);box-shadow:inset 0 -.25em 0 rgba(0,0,0,.2)}
.btn[disabled]{filter:grayscale(.85) brightness(.7);cursor:default}
.btn .k{font:normal 1.3em "Yuji Syuku",serif}
#brushBtn{position:relative;overflow:hidden;padding:0 .8em}
#brushBtn .ink{position:absolute;left:0;bottom:0;height:.22em;background:var(--jade);box-shadow:0 0 .6em var(--jade);transition:width .2s}
#brushBtn.on{background:#f1e4c8;color:var(--ink)}
#brushBtn.low{opacity:.6}
.preview{position:absolute;right:1.4%;top:calc(2.2% + var(--bh) + 6px);display:flex;gap:.3em;font-size:.78em;align-items:center;padding:.15em .55em;background:rgba(23,16,26,.6);border-radius:1em .3em 1em .3em;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
.preview img{width:1.5em;height:1.5em;image-rendering:pixelated;object-fit:contain}
.preview span{display:inline-flex;align-items:center;gap:.1em}
/* icônes pixel */
.ic{width:1.2em;height:1.2em;image-rendering:pixelated;object-fit:contain;vertical-align:-.22em;flex:none}
.stat .ic{width:1.35em;height:1.35em}
.stat .lb{font-size:.72em;opacity:.7;font-weight:600}
#side .stat .ic{width:1.5em;height:1.5em}
#waveBtn .pl{width:1.6em;height:1.6em;margin-left:.15em;filter:drop-shadow(0 .1em 0 rgba(0,0,0,.35))}
#speedBtn{flex-direction:column;gap:0;font-size:.8em;line-height:1}
#speedBtn .ic{width:1.3em;height:1.3em}
.dk em .ic{width:1em;height:1em;margin-right:.15em}
#card dt{display:flex;align-items:center;gap:.25em}
#card dt .ic{width:1.1em;height:1.1em}
.btn .ic{width:1.1em;height:1.1em}
/* écran titre */
.tscreen{padding:0;background:radial-gradient(ellipse 70% 60% at 50% 52%,rgba(12,8,13,.05),rgba(12,8,13,.72) 80%),linear-gradient(rgba(12,8,13,.5),rgba(12,8,13,0) 35%,rgba(12,8,13,0) 60%,rgba(12,8,13,.75));font-size:clamp(12px,calc(var(--u)*2),24px)}
.tscreen.show{display:block}
.torii{position:absolute;inset:0;pointer-events:none}
.torii i{position:absolute;display:block}
.kasagi{left:2%;right:2%;top:2.5%;height:6.5%;background:linear-gradient(#6a4a52,#2a1a22 30%,#140c12 75%);border-radius:50% 50% .3em .3em/90% 90% .3em .3em;box-shadow:0 .5em 1em rgba(0,0,0,.55);z-index:1}
.kasagi::after{content:"";position:absolute;left:3%;right:3%;bottom:-55%;height:60%;background:linear-gradient(#e0533a,#a8281a);border-radius:0 0 .2em .2em}
.nuki{left:9%;right:9%;top:21%;height:4%;background:linear-gradient(#e85a3e,#a8281a);box-shadow:0 .4em .8em rgba(0,0,0,.45)}
.pl{top:9%;bottom:0;width:5.2%;background:linear-gradient(90deg,#8a2014,#e0533a 38%,#c23a24 70%,#8a2014);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),0 0 1.5em rgba(0,0,0,.5)}
.pl::after{content:"";position:absolute;left:-12%;right:-12%;bottom:0;height:7%;background:linear-gradient(#2a1c22,#0c070b);border-radius:.2em .2em 0 0}
.pl.l{left:12%}.pl.r{right:12%}
.gaku{position:absolute;left:50%;top:5.5%;transform:translateX(-50%);z-index:2;display:flex;flex-direction:column;align-items:center;padding:.45em 2.2em .6em;background:linear-gradient(#24171f,#0f090d);border:.22em solid #c9a35a;border-radius:.25em;box-shadow:inset 0 0 0 .15em #120b10,inset 0 0 0 .3em rgba(226,178,76,.35),0 .8em 2em rgba(0,0,0,.6);text-align:center;animation:sway 6s ease-in-out infinite;transform-origin:50% -20%}
@keyframes sway{50%{transform:translateX(-50%) rotate(.6deg)}}
.gaku .kj{font:normal 1.05em "Yuji Syuku",serif;color:#e8c15a;letter-spacing:.5em;padding-left:.5em;opacity:.85}
.gaku h1{margin:.05em 0 0;font-weight:800;font-size:clamp(30px,calc(var(--u)*9),110px);line-height:.95;color:#f6e7c2;letter-spacing:.02em;text-shadow:0 .06em 0 #6a4a1a,0 0 .4em rgba(232,193,90,.35);display:flex;align-items:center;gap:.12em}
.gaku h1 b{font-size:.62em;background:var(--red);color:#fff1de;padding:.02em .22em .08em;border-radius:.12em;transform:rotate(4deg);box-shadow:inset 0 0 0 .07em rgba(255,240,220,.35),0 .1em .3em rgba(0,0,0,.4);text-shadow:none}
.gaku .sub{font-size:.95em;color:#d9c7a2;letter-spacing:.08em;margin-top:.15em}
.tmain{position:absolute;left:50%;top:44%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.8em;z-index:2}
.erow{display:flex;gap:.8em}
.ema{position:relative;appearance:none;border:0;cursor:pointer;font:inherit;font-weight:800;color:#2a1a12;display:flex;align-items:center;justify-content:center;gap:.45em;min-width:7.5em;height:2.9em;padding:.55em 1.2em 0;background:linear-gradient(#e8c999,#c9a06a 70%,#a87f4c);clip-path:polygon(50% 0,100% 26%,100% 100%,0 100%,0 26%);filter:drop-shadow(0 .35em .5em rgba(0,0,0,.5));transition:transform .15s,filter .15s;transform-origin:50% 0}
.ema::before{content:"";position:absolute;left:50%;top:.35em;width:.32em;height:.32em;margin-left:-.16em;border-radius:50%;background:#5a3a22}
.ema .ic{width:1.35em;height:1.35em}
.ema:hover{transform:rotate(-2deg) translateY(.1em);filter:drop-shadow(0 .5em .7em rgba(0,0,0,.55)) brightness(1.08)}
.ema:active{transform:scale(.96)}
.ema:focus-visible{outline:none;filter:drop-shadow(0 0 .25em #e8c15a) drop-shadow(0 .35em .5em rgba(0,0,0,.5))}
.ema.big{min-width:12em;height:4.4em;font-size:1.25em;flex-direction:row;flex-wrap:wrap;align-content:center;row-gap:0;color:#fff1de;background:linear-gradient(#e85a3e,#c23a24 55%,#8e2420);padding-top:.9em}
.ema.big span{font-size:1.35em;letter-spacing:.04em;text-shadow:0 .08em 0 rgba(0,0,0,.3)}
.ema.big small{flex-basis:100%;text-align:center;font-size:.58em;font-weight:600;opacity:.9}
.ema.big .ic{width:1.5em;height:1.5em}
.ema.gold{background:linear-gradient(#ffe39a,#e2b24c 60%,#b88a2a)}
.ema em{font-style:normal;font-size:.75em;min-width:1.5em;height:1.5em;display:grid;place-items:center;background:var(--red);color:#fff;border-radius:1em;padding:0 .35em;box-shadow:0 0 0 .12em #2a1a12}
.cast{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);display:flex;align-items:flex-end;gap:calc(var(--u)*1.6);padding:0 calc(var(--u)*3) calc(var(--u)*.8);z-index:2}
.cast::before{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--u)*3);background:linear-gradient(#a09c92,#6f6b66);border-radius:.2em;box-shadow:inset 0 .15em 0 #cbc6b8,0 .5em 1em rgba(0,0,0,.5)}
.hero{position:relative;display:flex;flex-direction:column;align-items:center}
.hero img{height:calc(var(--u)*15);image-rendering:pixelated;filter:drop-shadow(0 .2em 0 rgba(0,0,0,.35));animation:bob 2.4s ease-in-out var(--d) infinite}
.hero span{position:absolute;bottom:calc(var(--u)*-2.5);font-size:.62em;white-space:nowrap;opacity:0;transition:opacity .2s;background:var(--ink);padding:0 .4em;border-radius:.3em}
.hero:hover span{opacity:1}
@keyframes bob{50%{transform:translateY(calc(var(--u)*-.8))}}
.tstat{position:absolute;right:1.6%;bottom:2.4%;display:flex;flex-direction:column;align-items:flex-end;gap:.4em;z-index:2;font-size:.85em}
.tstat>span{display:inline-flex;align-items:center;gap:.3em;background:rgba(23,16,26,.8);padding:.25em .7em;border-radius:1em;color:var(--gold);font-weight:800}
@media (prefers-reduced-motion:reduce){.gaku,.hero img{animation:none}}
#bossBar{position:absolute;left:50%;top:calc(2.2% + var(--bh) + 6px);transform:translateX(-50%);width:44%;display:none;flex-direction:column;align-items:center;gap:.2em;pointer-events:none;font-size:.85em}
#bossBar.show{display:flex}
#bossBar b{color:#ffd0b0;text-shadow:0 .1em .3em #000;white-space:nowrap}
#bossBar .bb{width:100%;height:.7em;background:#1c1220;border-radius:.4em;box-shadow:0 0 0 2px #e2b24c,0 .2em .5em rgba(0,0,0,.6);overflow:hidden}
#bossBar i{display:block;height:100%;width:100%;background:linear-gradient(#ff7a5a,#c8322a);transition:width .15s}
/* barre d'équipe (droite) */
#side{position:absolute;display:none;flex-direction:column;gap:calc(var(--u)*1.1);padding:calc(var(--u)*1.6) calc(var(--u)*1.3);background:linear-gradient(90deg,#120b12,#21151f 12%,#1a1119);box-shadow:inset 3px 0 0 #3a2430,inset 5px 0 0 #0c070b;font-size:clamp(10px,calc(var(--u)*2.6),18px);z-index:3;touch-action:none}
#side.show{display:flex}
#side::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.06;background:repeating-linear-gradient(0deg,#f1e4c8 0 1px,transparent 1px 6px)}
#side .res{display:flex;flex-direction:column;gap:calc(var(--u)*.7)}
#side .stat{height:auto;padding:.25em .6em;font-size:1.05em;justify-content:space-between}
#side .stat.g b{color:var(--gold)}
.deck{flex:1;display:flex;flex-direction:column;gap:calc(var(--u)*1);min-height:0}
.dk{position:relative;flex:1;min-height:0;display:flex;align-items:center;gap:.35em;padding:0 .45em 0 .2em;border:0;cursor:grab;font:inherit;color:var(--washi);text-align:left;background:linear-gradient(100deg,#f3e6c8 0 2.6em,#2a1c26 2.6em);border-radius:.3em .9em .35em .8em/.8em .35em .9em .3em;box-shadow:inset 0 0 0 1px rgba(241,228,200,.18),0 .2em .5em rgba(0,0,0,.45);transition:transform .12s,filter .15s;touch-action:none}
.dk img{width:2.4em;height:100%;max-height:3.4em;object-fit:contain;image-rendering:pixelated;flex:none;pointer-events:none;filter:drop-shadow(0 .1em 0 rgba(0,0,0,.35))}
.dk span{display:flex;flex-direction:column;line-height:1.05;min-width:0;pointer-events:none}
.dk b{font-size:.78em;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk em{font-style:normal;font-weight:800;color:var(--gold);font-size:.95em}
.dk i{position:absolute;left:.15em;top:.05em;font:normal .7em "Yuji Syuku",serif;color:var(--red);pointer-events:none}
.dk:hover{filter:brightness(1.12)}.dk:active{cursor:grabbing}
.dk.sel{box-shadow:inset 0 0 0 2px var(--gold),0 0 .8em rgba(226,178,76,.45);transform:translateX(-.25em)}
.dk.no{filter:grayscale(.9) brightness(.62)}
.dk.no em{color:#9a8f86}
.dk.empty{background:rgba(241,228,200,.04);box-shadow:inset 0 0 0 1px rgba(241,228,200,.1);cursor:default}
.dk:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.sbtns{display:flex;gap:calc(var(--u)*.8);align-items:center}
#waveBtn{flex:1;height:calc(var(--u)*13);min-height:44px;border-radius:50%/48%;padding:0;flex-direction:column;gap:0;line-height:1;background:radial-gradient(circle at 40% 30%,#ff7a4a,#d4402c 55%,#8e2420);box-shadow:inset 0 -.3em 0 rgba(0,0,0,.3),0 0 0 .18em #120b12,0 0 0 .3em rgba(241,228,200,.25),0 .4em 1em rgba(212,64,44,.4)}
#waveBtn .k{font-size:1.5em}
#waveBtn small{font-size:.62em;opacity:.9;font-weight:800;white-space:nowrap}
#waveBtn[disabled]{filter:grayscale(.6) brightness(.6)}
#waveBtn.pulse{animation:wp 1.4s ease-in-out infinite}
@keyframes wp{50%{box-shadow:inset 0 -.3em 0 rgba(0,0,0,.3),0 0 0 .18em #120b12,0 0 0 .5em rgba(255,200,120,.45),0 .4em 1.4em rgba(255,110,60,.7)}}
#speedBtn{width:2.6em;height:2.6em;min-width:0;padding:0;border-radius:50%}
/* fantôme de glisser-déposer */
#drag{position:fixed;left:0;top:0;width:3.4em;height:3.4em;pointer-events:none;z-index:20;display:none;transform:translate(-50%,-70%);image-rendering:pixelated;opacity:.85;filter:drop-shadow(0 .3em .4em rgba(0,0,0,.5))}
#tip{position:absolute;transform:translate(-50%,0);background:var(--ink);color:var(--washi);padding:.35em .7em;border-radius:.4em;font-size:clamp(11px,calc(var(--u)*1.35),16px);white-space:nowrap;display:none;pointer-events:none;z-index:3}
/* panneau d'amélioration (style mobile) */
#card{position:absolute;top:calc(2.2% + var(--bh) + 8px);bottom:2.5%;display:none;flex-direction:column;width:clamp(230px,calc(var(--u)*40),380px);background:linear-gradient(#f6ecd4,#e7d5ae);color:var(--ink);border-radius:.4em 1.2em .5em 1em/1em .5em 1.2em .4em;padding:.7em .8em;box-shadow:0 0 0 3px var(--ink),0 .6em 1.6em rgba(0,0,0,.55);font-size:clamp(11px,calc(var(--u)*2.15),16px);animation:slide .22s cubic-bezier(.3,1.3,.5,1) both;overflow:auto}
#card.show{display:flex}
#card.l{left:1.4%}#card.r{right:1.4%}
@keyframes slide{from{transform:translateX(var(--sx,-30px));opacity:0}}
#card.r{--sx:30px}
#card .hd{display:flex;gap:.6em;align-items:center;padding-right:2.6em}
#card .hd img{width:3.6em;height:3.6em;object-fit:contain;image-rendering:pixelated;background:radial-gradient(circle,rgba(212,64,44,.18),transparent 70%);flex:none}
#card h3{margin:0;font-size:1.25em;line-height:1.05;font-weight:800}
#card .hd small{display:block;opacity:.65;font-weight:600;font-size:.82em}
.seal{position:absolute;right:.75em;top:.75em;width:2.2em;height:2.2em;background:var(--red);color:#fff4e2;font:normal 1.35em/1.65 "Yuji Syuku",serif;text-align:center;border-radius:.2em;transform:rotate(4deg);box-shadow:inset 0 0 0 .12em rgba(255,240,220,.35)}
#card dl{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:.05em .6em;margin:.5em 0 .55em;font-size:.88em}
#card dt{opacity:.62}#card dd{margin:0;font-weight:800;font-variant-numeric:tabular-nums}
#card dd s{color:#2f7d4a;text-decoration:none}
.paths{display:grid;grid-template-columns:1fr 1fr;gap:.5em;flex:1;min-height:0}
.pth{display:flex;flex-direction:column;align-items:center;gap:.25em;padding:.5em .4em;border-radius:.5em;background:rgba(28,18,32,.08);box-shadow:inset 0 0 0 1px rgba(28,18,32,.15);text-align:center}
.pth.on{background:rgba(212,64,44,.1);box-shadow:inset 0 0 0 2px var(--red)}
.pth.off{opacity:.45}
.pth b{font-size:.95em;line-height:1.1}
.pth small{font-size:.78em;opacity:.75;line-height:1.15}
.pth img{width:3.4em;height:3em;object-fit:contain;image-rendering:pixelated}
.pips{display:flex;gap:.18em}
.pips i{width:.62em;height:.62em;border-radius:.15em;transform:rotate(45deg);background:rgba(28,18,32,.18)}
.pips i.f{background:var(--red);box-shadow:0 0 0 1px #6a1a12}
.pth .btn{width:100%;height:2.5em;font-size:.92em;margin-top:auto}
#card .row{display:flex;gap:.5em;margin-top:.55em}
#card .row .btn{flex:1;height:2.5em;font-size:.92em;color:var(--washi)}
#card .btn.dark{background:var(--ink2)}
#card .x{position:absolute;right:.6em;bottom:.6em}
/* screens */
.screen{position:absolute;inset:0;display:none;align-items:center;padding:4% 6%;background:linear-gradient(90deg,rgba(12,8,13,.92) 0%,rgba(12,8,13,.7) 42%,rgba(12,8,13,.05) 75%);z-index:4}
.screen.show{display:flex}
.panel{max-width:56%;font-size:clamp(12px,calc(var(--u)*1.6),20px)}
.hanko{display:inline-grid;place-items:center;width:2.6em;height:2.6em;background:var(--red);color:#fff1de;font:normal 2em/1 "Yuji Syuku",serif;border-radius:.18em;transform:rotate(-4deg);box-shadow:inset 0 0 0 .1em rgba(255,240,220,.3),0 .2em .8em rgba(212,64,44,.45);margin-bottom:.35em}
.panel h1{margin:0;font-weight:800;font-size:clamp(28px,calc(var(--u)*6.4),76px);line-height:1.02;text-wrap:balance}
.panel h1 span{display:block;font:normal .42em "Yuji Syuku",serif;color:var(--gold);margin-top:.25em}
.panel p{margin:.8em 0;opacity:.88;max-width:34em}
.panel .acts{display:flex;gap:.6em;flex-wrap:wrap;align-items:center;margin-top:1em}
.panel .btn{height:2.8em;font-size:1.05em}
.stars{font-size:2em;letter-spacing:.12em;color:var(--gold);text-shadow:0 0 .4em rgba(226,178,76,.5)}
.stars .off{color:rgba(241,228,200,.2);text-shadow:none}
.rew{display:flex;gap:.6em;flex-wrap:wrap;margin:.6em 0}
.rew span{display:inline-flex;align-items:center;gap:.35em;background:rgba(241,228,200,.1);padding:.3em .7em;border-radius:.4em}
.rew img{width:1.8em;height:1.8em;image-rendering:pixelated;object-fit:contain}
/* full menus */
.menu{position:absolute;inset:0;display:none;flex-direction:column;background:radial-gradient(120% 90% at 50% 0%,#2a1d2a,#120c13 70%);z-index:5;font-size:clamp(12px,calc(var(--u)*1.55),18px)}
.menu.show{display:flex}
.menu::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.08;background:repeating-linear-gradient(90deg,#f1e4c8 0 1px,transparent 1px 7px),repeating-linear-gradient(0deg,#f1e4c8 0 1px,transparent 1px 9px)}
.mhead{position:relative;display:flex;align-items:center;gap:.7em;padding:.8em 1.2em;border-bottom:1px solid rgba(241,228,200,.12)}
.mhead h2{margin:0;font-size:1.5em;font-weight:800;flex:1;display:flex;align-items:baseline;gap:.5em}
.mhead h2 span{font:normal .8em "Yuji Syuku",serif;color:var(--gold)}
.mhead .btn{height:2.6em}
.koban{display:inline-flex;align-items:center;gap:.35em;font-weight:800;background:rgba(226,178,76,.14);color:var(--gold);padding:.3em .8em;border-radius:1em;white-space:nowrap}
.koban img{width:1.3em;height:1.3em;image-rendering:pixelated}
.mbody{position:relative;flex:1;overflow:auto;padding:1em 1.2em 1.4em;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.lgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.8em}
@media (max-width:760px){.lgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.lv{position:relative;border:0;padding:0;cursor:pointer;background:#1e1520;border-radius:.4em .9em .4em .8em;overflow:hidden;color:var(--washi);font:inherit;text-align:left;box-shadow:0 0 0 2px rgba(241,228,200,.14),0 .4em 1em rgba(0,0,0,.4);transition:transform .15s}
.lv:hover:not([disabled]){transform:translateY(-3px);box-shadow:0 0 0 2px var(--gold),0 .6em 1.2em rgba(0,0,0,.5)}
.lv:focus-visible{outline:2px solid var(--gold)}
.lv .th{display:block;width:100%;aspect-ratio:16/9;background:#3a2a30 center/cover;image-rendering:pixelated}
.lv .nm{display:block;padding:.45em .6em .5em;font-weight:800;line-height:1.15;font-size:.92em}
.lv .nm small{display:block;font-weight:600;opacity:.6;font-size:.82em}
.lv .no{position:absolute;left:.4em;top:.4em;background:var(--ink);color:var(--gold);font-weight:800;padding:.05em .5em;border-radius:.4em;font-size:.85em}
.lv .kj{position:absolute;right:.4em;top:.35em;width:1.7em;height:1.7em;display:grid;place-items:center;background:var(--red);color:#fff1de;font:normal 1.05em "Yuji Syuku",serif;border-radius:.15em;transform:rotate(4deg)}
.lv .st{position:absolute;right:.4em;top:0;margin-top:calc(56.25% - 1.6em);color:var(--gold);letter-spacing:.05em;background:rgba(23,16,26,.75);padding:0 .35em;border-radius:.3em;font-size:.9em}
.lv .st .off{color:rgba(241,228,200,.2)}
.lv[disabled]{cursor:default;filter:grayscale(1) brightness(.5)}
.lv[disabled] .kj{background:#555}
.sec{margin:0 0 1.4em}
.sec h3{margin:0 0 .6em;font-size:1.1em;font-weight:800;display:flex;gap:.5em;align-items:baseline}
.sec h3 span{font:normal .9em "Yuji Syuku",serif;color:var(--gold)}
.chrow{display:flex;gap:.8em;flex-wrap:wrap}
.ch{display:flex;flex-direction:column;align-items:center;gap:.3em;width:8.5em;padding:.7em .5em;background:rgba(241,228,200,.06);border-radius:.6em;box-shadow:inset 0 0 0 1px rgba(241,228,200,.1);text-align:center}
.ch img{width:5em;height:4.3em;image-rendering:pixelated;object-fit:contain}
.ch b{font-size:.92em}
.ch small{opacity:.65;font-size:.78em;line-height:1.2;min-height:2.4em}
.ch .btn{height:2.3em;font-size:.9em;width:100%}
.empty{opacity:.6;font-size:.92em}
.coll{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.6em}
.tw{display:flex;align-items:center;gap:.5em;padding:.4em .5em;background:rgba(241,228,200,.06);border-radius:.5em}
.tw img{width:2.6em;height:2.6em;image-rendering:pixelated;object-fit:contain;flex:none}
.tw b{display:block;font-size:.82em;line-height:1.15}
.tw small{color:var(--gold);font-size:.78em}
.tw.lock{opacity:.4}.tw.lock img{filter:brightness(0)}
@media (max-width:760px){.coll{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* menu équipe */
.team{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:1.2em}
@media (max-width:760px){.team{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.8em}}
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.45em;margin-bottom:1em}
.slot{position:relative;aspect-ratio:.82;border:0;padding:.2em;cursor:pointer;font:inherit;color:var(--washi);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;background:linear-gradient(#3a2632,#1e141c);border-radius:.4em .9em .4em .8em;box-shadow:inset 0 0 0 1px rgba(241,228,200,.18)}
.slot img{flex:1;min-height:0;width:100%;object-fit:contain;image-rendering:pixelated}
.slot b{font-size:.72em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slot .n{position:absolute;left:.3em;top:.15em;font:normal .8em "Yuji Syuku",serif;color:var(--gold)}
.slot.sel{box-shadow:inset 0 0 0 2px var(--gold),0 0 .9em rgba(226,178,76,.35)}
.slot.e{opacity:.5}
.roster{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.45em}
.ro{position:relative;border:0;padding:.25em .2em .3em;cursor:pointer;font:inherit;color:var(--washi);display:flex;flex-direction:column;align-items:center;background:rgba(241,228,200,.06);border-radius:.5em;box-shadow:inset 0 0 0 1px rgba(241,228,200,.1)}
.ro img{width:100%;height:3.2em;object-fit:contain;image-rendering:pixelated}
.ro b{font-size:.72em;line-height:1.1;text-align:center}
.ro small{color:var(--gold);font-size:.68em}
.ro.in::after{content:"編";position:absolute;right:.25em;top:.15em;font:normal .8em "Yuji Syuku",serif;color:#fff1de;background:var(--red);width:1.3em;height:1.3em;display:grid;place-items:center;border-radius:.15em}
.ro.cur{box-shadow:inset 0 0 0 2px var(--gold)}
.ro.lock{cursor:default}.ro.lock img{filter:brightness(0) opacity(.5)}.ro.lock b{opacity:.45}
.ro:focus-visible,.slot:focus-visible{outline:2px solid var(--gold)}
.det{background:linear-gradient(#f6ecd4,#e7d5ae);color:var(--ink);border-radius:.4em 1.2em .5em 1em/1em .5em 1.2em .4em;padding:.8em;box-shadow:0 0 0 3px var(--ink),0 .5em 1.2em rgba(0,0,0,.45);position:relative}
.det h3{margin:0;font-size:1.3em;font-weight:800;line-height:1.05;padding-right:2.4em}
.det p{margin:.3em 0 .5em;font-size:.86em;opacity:.8}
.det .rk{color:var(--red);font-size:.85em;font-weight:800}
.tree{display:grid;grid-template-columns:1fr 1fr;gap:.2em .6em;margin:.4em 0 .6em;position:relative}
.tree .root{grid-column:1/3;display:flex;flex-direction:column;align-items:center}
.tree .col{display:flex;flex-direction:column;align-items:center;gap:.1em;padding:.3em .2em;border-radius:.5em;background:rgba(28,18,32,.07)}
.tree img{height:3.3em;width:100%;object-fit:contain;image-rendering:pixelated}
.tree .root img{height:3.6em}
.tree b{font-size:.8em;text-align:center;line-height:1.1}
.tree small{font-size:.7em;opacity:.7;text-align:center;line-height:1.15}
.tree .ar{color:var(--red);font-size:.8em;line-height:.6}
.det .btn{width:100%;height:2.6em;color:var(--washi)}
/* chest opening */
#open{position:absolute;inset:0;z-index:7;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1em;background:radial-gradient(circle at 50% 42%,rgba(255,214,120,.22),rgba(12,8,13,.94) 55%);font-size:clamp(12px,calc(var(--u)*1.6),19px);cursor:pointer}
#open.show{display:flex}
#open .big{width:clamp(110px,calc(var(--u)*24),260px);image-rendering:pixelated;filter:drop-shadow(0 .6em 1.2em rgba(0,0,0,.6))}
#open.shake .big{animation:shk .12s linear infinite}
@keyframes shk{0%{transform:rotate(-4deg) scale(1)}50%{transform:rotate(4deg) scale(1.04)}100%{transform:rotate(-4deg)}}
#open .burst{position:absolute;width:60vmin;height:60vmin;border-radius:50%;background:radial-gradient(circle,rgba(255,236,170,.75),rgba(255,180,80,0) 65%);opacity:0;pointer-events:none}
#open.opened .burst{animation:bst .9s ease-out both}
@keyframes bst{0%{opacity:1;transform:scale(.2)}100%{opacity:0;transform:scale(1.6)}}
#open .items{display:flex;gap:.8em;flex-wrap:wrap;justify-content:center;max-width:90%;min-height:7em}
.rc{display:flex;flex-direction:column;align-items:center;gap:.25em;width:8.5em;padding:.7em .5em;background:linear-gradient(#f6ecd4,#e2cfa6);color:var(--ink);border-radius:.5em;box-shadow:0 0 0 3px var(--ink),0 .5em 1em rgba(0,0,0,.5);text-align:center;animation:card .45s cubic-bezier(.3,1.5,.5,1) both}
.rc img{width:3.2em;height:3.2em;image-rendering:pixelated;object-fit:contain}
.rc b{font-size:.95em;line-height:1.1}
.rc small{font-size:.78em;opacity:.7;line-height:1.15}
.rc.new{background:linear-gradient(#ffe9b0,#e2b24c)}
@keyframes card{from{transform:translateY(20px) rotateY(90deg);opacity:0}}
#open .tap{opacity:.6;font-size:.85em}
/* pause */
#pausePanel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;flex-direction:column;gap:.5em;padding:1.2em 1.4em;background:rgba(23,16,26,.94);border-radius:.5em 1.4em .5em 1.2em;box-shadow:0 0 0 2px rgba(241,228,200,.18),0 1em 2em rgba(0,0,0,.6);min-width:14em;text-align:center}
#pausePanel.show{display:flex}
#pausePanel h3{margin:0 0 .3em;font-size:1.4em}
#pausePanel .btn{height:2.6em;width:100%}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none;opacity:0}
#banner .kj{display:block;font:normal calc(var(--u)*9) "Yuji Syuku",serif;color:rgba(241,228,200,.92);text-shadow:0 0 .3em rgba(0,0,0,.6);line-height:1}
#banner .tx{display:inline-block;margin-top:.3em;font-weight:800;font-size:calc(var(--u)*2.4);background:var(--red);color:#fff3e3;padding:.1em .9em;border-radius:.2em 1em .3em .9em}
#banner.go{animation:ban 2.4s ease both}
@keyframes ban{0%{opacity:0;transform:translateY(12px) scale(1.06)}12%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
#hint{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);background:rgba(23,16,26,.82);padding:.4em 1em;border-radius:1em .3em 1em .3em;font-size:clamp(12px,calc(var(--u)*1.5),18px);white-space:nowrap;pointer-events:none;transition:opacity .4s}
#rot{position:fixed;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);padding:.4em 1em;border-radius:1em;font-size:14px;display:none;z-index:9}
@media (max-height:420px){.stat .lb,#brushBtn .lbl{display:none}}
@media (orientation:portrait) and (max-width:700px){#rot{display:block}}
@media (prefers-reduced-motion:reduce){#card,#waveBtn.pulse,#banner.go,.rc,#open.shake .big,#open.opened .burst{animation:none}#banner.go{opacity:1}}
/* raretés */
.ro{background:linear-gradient(165deg,color-mix(in srgb,var(--rc) 55%,transparent),color-mix(in srgb,var(--rc) 14%,#1c1220) 70%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--rc) 70%,transparent)}
.ro.cur{box-shadow:inset 0 0 0 2px #fff3dc,0 0 .8em color-mix(in srgb,var(--rc) 60%,transparent)}
.ro.lock{background:linear-gradient(165deg,color-mix(in srgb,var(--rc) 22%,transparent),#1c1220 70%)}
.slot[style*="--rc"]{background:linear-gradient(170deg,color-mix(in srgb,var(--rc) 60%,#1c1220),#1e141c 75%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--rc) 80%,transparent)}
.slot.sel{box-shadow:inset 0 0 0 2px #fff3dc,0 0 .9em color-mix(in srgb,var(--rc,#e2b24c) 55%,transparent)}
.rar{display:inline-block;font-size:.72em;font-weight:800;color:#fff;background:var(--rc);padding:.05em .55em;border-radius:1em;letter-spacing:.03em;vertical-align:.15em}
.dk{box-shadow:inset .28em 0 0 var(--rc,transparent),inset 0 0 0 1px rgba(241,228,200,.18),0 .2em .5em rgba(0,0,0,.45)}
.rc.new[style*="--rc"]{background:linear-gradient(170deg,color-mix(in srgb,var(--rc) 45%,#fff6dc),#e2cfa6)}
.rlegend{display:flex;gap:.8em;flex-wrap:wrap;font-size:.75em;margin:-.3em 0 .6em}
.rlegend span{display:inline-flex;align-items:center;gap:.3em}
.rlegend i{width:.8em;height:.8em;border-radius:.2em;background:var(--rc)}
.ro small .ic,.det .ic{width:1em;height:1em;vertical-align:-.15em}
/* carte du pays */
.wbody{display:flex;align-items:center;justify-content:center;padding:.6em 1em 1em;overflow:hidden}
.wmap{position:relative;height:100%;max-width:100%;aspect-ratio:16/9;border-radius:.4em;box-shadow:0 0 0 .3em #2a1c26,0 0 0 .45em #c9a35a,0 1em 2em rgba(0,0,0,.6);background:#3a7698}
.wmap img{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;border-radius:.4em}
.wmap::after{content:"";position:absolute;inset:0;border-radius:.4em;pointer-events:none;box-shadow:inset 0 0 3em rgba(40,20,10,.45)}
.wn{position:absolute;transform:translate(-50%,-62%);width:2.5em;height:2.5em;border:0;padding:0;cursor:pointer;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fbf2dd,#e2cfa6 70%,#c7ae80);box-shadow:0 0 0 .18em #1c1220,0 .3em .6em rgba(0,0,0,.5);color:#1c1220;font:inherit;z-index:1;transition:transform .15s}
.wn span{font:normal 1.2em/1 "Yuji Syuku",serif}
.wn i{position:absolute;left:50%;top:100%;transform:translate(-50%,.15em);font-style:normal;font-weight:800;font-size:.72em;white-space:nowrap;background:#1c1220;color:#f6ecd4;padding:0 .45em;border-radius:.6em;line-height:1.4}
.wn.done{background:radial-gradient(circle at 40% 35%,#ff8a6a,#d4402c 65%,#8e2420);color:#fff1de;box-shadow:0 0 0 .18em #1c1220,0 0 0 .32em #e2b24c,0 .3em .6em rgba(0,0,0,.5)}
.wn.done i{color:#e2b24c}
.wn.next{animation:wpulse 1.5s ease-in-out infinite}
@keyframes wpulse{50%{box-shadow:0 0 0 .18em #1c1220,0 0 0 .5em rgba(255,236,170,.6),0 .3em .6em rgba(0,0,0,.5)}}
.wn.sel{transform:translate(-50%,-62%) scale(1.22);z-index:2}
.wn.lock{background:#3a2e36;color:#8a7e86;cursor:default;box-shadow:0 0 0 .18em #1c1220}
.wn.lock i{opacity:.6}
.wn:hover:not(.lock){transform:translate(-50%,-62%) scale(1.15)}
.wn:focus-visible{outline:2px solid #e2b24c;outline-offset:3px}
.wcard{position:absolute;left:2%;top:3%;display:flex;align-items:center;gap:.7em;max-width:62%;padding:.5em .6em;background:linear-gradient(#f6ecd4,#e7d5ae);color:var(--ink);border-radius:.4em 1em .5em .9em/.9em .5em 1em .4em;box-shadow:0 0 0 3px var(--ink),0 .5em 1.2em rgba(0,0,0,.5);z-index:3;animation:pop .2s both}
.wcard .th{width:6.5em;aspect-ratio:16/9;flex:none;border-radius:.25em;background:#3a2a30 center/cover;image-rendering:pixelated;box-shadow:0 0 0 2px var(--ink)}
.wcard .tx{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.wcard b{font-size:1.1em;font-weight:800}
.wcard small{font-size:.75em;opacity:.7}
.wcard .st{color:var(--red);letter-spacing:.08em}.wcard .st .off{color:rgba(28,18,32,.2)}
.wcard .btn{height:2.6em;flex:none}

/* ---------- écran titre : emplacements des boutons d'un jeu mobile, matières japonaises (laque, washi, feuille d'or, sceaux) ---------- */
#title{--lq1:#d8432f;--lq2:#8e2420;--ai1:#3a5590;--ai2:#1c2a52;--su1:#3a2c36;--su2:#150e14;--kin1:#f2d27a;--kin2:#b8862a;--gold:#e2b24c;
  background:radial-gradient(ellipse 75% 65% at 50% 50%,rgba(12,8,13,0),rgba(12,8,13,.6) 85%),linear-gradient(rgba(12,8,13,.55),rgba(12,8,13,0) 30%,rgba(12,8,13,0) 58%,rgba(12,8,13,.75))}
#title .gaku{top:4%}
#title .cast{bottom:26%}
.bt-top{position:absolute;left:1.8%;right:1.8%;top:3%;display:flex;justify-content:space-between;align-items:flex-start;z-index:3}
/* parchemin de progression */
.bt-scroll{display:flex;align-items:stretch;filter:drop-shadow(0 .3em .4em rgba(0,0,0,.5))}
.bt-roll{width:.55em;border-radius:.3em;background:linear-gradient(90deg,#4a2a1a,#8a5a36 45%,#3a2014);box-shadow:inset 0 .3em 0 #c8a060,inset 0 -.3em 0 #c8a060}
.bt-scroll>.bt-seal,.bt-scroll>.bt-pv{background:linear-gradient(#f6ecd4,#e2cfa6)}
.bt-seal{display:grid;place-items:center;padding:0 .25em 0 .5em;font:normal 1.3em/1 "Yuji Syuku",serif;color:#fff1de}
.bt-seal::before{content:"";position:absolute}
.bt-scroll .bt-seal{position:relative;color:transparent}
.bt-scroll .bt-seal::after{content:"星";position:absolute;inset:auto;width:1.55em;height:1.55em;display:grid;place-items:center;color:#fff1de;background:var(--red);border-radius:.15em;transform:rotate(-5deg);box-shadow:inset 0 0 0 .08em rgba(255,240,220,.35)}
.bt-pv{display:flex;flex-direction:column;justify-content:center;gap:.2em;padding:.4em 1em .45em .7em;color:var(--ink);line-height:1}
.bt-pv b{font-weight:800;font-size:1em}.bt-pv b small{font-size:.8em;opacity:.7}
.bt-pv>small{font-size:.68em;opacity:.75}
.bt-bar{display:block;width:8.5em;height:.45em;background:rgba(23,16,26,.18);border-radius:1em;overflow:hidden}
.bt-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ink),#5a3a4a);border-radius:1em}
.bt-right{display:flex;gap:.55em;align-items:center}
/* koban : pièce ovale en or */
.bt-koban{display:inline-flex;align-items:center;gap:.35em;height:2.2em;padding:0 1em 0 .4em;color:#3a2410;font-weight:800;background:radial-gradient(ellipse at 35% 30%,#fff3c0,var(--kin1) 35%,var(--kin2));border-radius:50%/50%;border-radius:2em;box-shadow:inset 0 0 0 .12em #8a5a1a,inset 0 0 0 .22em rgba(255,240,190,.6),0 .25em .4em rgba(0,0,0,.45)}
.bt-koban img{width:1.4em;height:1.4em;image-rendering:pixelated}
/* sceau du son */
.bt-hanko{appearance:none;cursor:pointer;width:2.3em;height:2.3em;border:0;border-radius:.2em;background:var(--red);color:#fff1de;font:normal 1.15em/1 "Yuji Syuku",serif;transform:rotate(4deg);box-shadow:inset 0 0 0 .1em rgba(255,240,220,.35),0 .2em .4em rgba(0,0,0,.45);transition:transform .1s}
.bt-hanko[aria-pressed="true"]{background:#5a5058;color:#b8aeb4}
.bt-hanko:active{transform:rotate(4deg) scale(.92)}
/* gros bouton central : plaque de laque vermillon cerclée d'or */
.bt-play{position:absolute;left:50%;bottom:3.5%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.3em;z-index:3}
.bt-go,.bt-sq{position:relative;appearance:none;border:0;cursor:pointer;font:inherit;display:flex;align-items:center;justify-content:center;transition:transform .08s,box-shadow .08s}
.bt-go{gap:.35em;min-width:8.5em;height:2.4em;padding:0 1em 0 .5em;font-size:clamp(22px,calc(var(--u)*6),70px);color:#fff1de;border-radius:.18em .5em .2em .45em/.45em .2em .5em .18em;
  background:linear-gradient(100deg,var(--lq2),var(--lq1) 40%,#e8583e 55%,var(--lq1) 70%,var(--lq2));
  box-shadow:inset 0 0 0 .06em #3a0e0a,inset 0 0 0 .12em var(--gold),inset 0 .16em 0 .12em rgba(255,220,190,.25),inset 0 -.18em 0 .12em rgba(0,0,0,.25),0 .14em 0 #4a120c,0 .3em .5em rgba(0,0,0,.5)}
.bt-go .k{display:grid;place-items:center;width:1.45em;height:1.45em;font:normal .75em/1 "Yuji Syuku",serif;background:#f6ecd4;color:var(--red2);border-radius:.15em;transform:rotate(-5deg);box-shadow:0 0 0 .06em var(--ink)}
.bt-go .l{font-weight:800;letter-spacing:.04em;text-shadow:0 .06em 0 rgba(0,0,0,.4)}
#tProg{font-size:clamp(11px,calc(var(--u)*2.2),22px);color:var(--washi);background:rgba(23,16,26,.75);padding:.1em .8em;border-radius:1em}
/* tuiles de coin : laque, gros kanji au pinceau */
.bt-left,.bt-rightb{position:absolute;bottom:3.5%;display:flex;gap:.7em;z-index:3}

  for(let y=1;y<5;y++){R(g,4,y,w-8,1,top[y-1]);for(let x=6;x<w-6;x++){const h=hash(x>>1,y+((x>>3)%3));if(y>1&&h>.86)P(g,x,y,'#c4a488');else if(y<4&&h<.06)P(g,x,y,'#ecd8c4')}}
  for(let x=10;x<w-10;x+=23){const L=6+(x*7%5);for(let k=0;k<L;k++)P(g,x+k,1+((k>>1)%3),'#c9aa90')}

  // volutes dorées aux extrémités

    case'boom':noise(t,.6,.35,'lowpass',420);tone(72,t,.5,'sine',.5,sfxG,.45);break;
    case'breath':noise(t,.25,.12,'bandpass',600,sfxG,.5);break;
    case'thunder':noise(t,.14,.3,'highpass',2600);noise(t,.9,.32,'lowpass',900);tone(55,t,.6,'sine',.25,sfxG,.7);break;
    case'gong':tone(196,t,1.2,'sine',.16);tone(294,t,.9,'sine',.07);tone(392.5,t,.6,'triangle',.03);break;
    case'death':tone(240,t,.25,'triangle',.07,sfxG,.5);break;
    case'coin':tone(1568,t,.12,'square',.025);tone(2093,t+.07,.18,'square',.025);break;
    case'build':[293.7,370,440].forEach((f,i)=>koto(f,t+i*.06,.16,sfxG));tone(118,t,.4,'sine',.4,sfxG,.5);break;
    case'tick':koto(587,t,.07,sfxG);break;
    case'no':tone(160,t,.15,'square',.04,sfxG,.8);break;
    case'hurt':tone(130,t,.5,'sawtooth',.12,sfxG,.5);noise(t,.3,.2,'lowpass',500);break;
    case'brushOn':tone(220,t,.8,'sine',.12,sfxG,2);noise(t,.6,.12,'bandpass',800,sfxG,.5);break;
    case'brush':noise(t,.08,.05,'bandpass',1200+Math.random()*600,sfxG,1.5);break;
    case'slash':noise(t,.4,.42,'bandpass',1600,sfxG,.6);tone(320,t,.25,'sawtooth',.06,sfxG,3);break;
    case'rumble':for(let i=0;i<6;i++)noise(t+i*.15,.12,.2,'lowpass',300);break;
    case'lose':[293.7,261.6,220,174.6].forEach((f,i)=>koto(f,t+i*.35,.18,sfxG));tone(80,t,1.5,'sine',.5,sfxG,.5);break;
    case'win':[293.7,349.2,440,523.3,587.3].forEach((f,i)=>koto(f,t+i*.15,.18,sfxG));break}}
const SC=[146.83,164.81,174.61,220,233.08];
function music(){if(!AC||muted||state=='title')return;const spb=60/78/2;
  while(nextN<AC.currentTime+.25){if(nextN<AC.currentTime)nextN=AC.currentTime+.02;const t=nextN,st=stepN%32;
    if(st%2==0&&Math.random()<.5){mel=clamp(mel+[-2,-1,-1,1,1,2,0][Math.random()*7|0],0,11);const f=SC[mel%5]*(1<<Math.floor(mel/5));koto(f,t,.13,musG);if(Math.random()<.2)koto(f*1.5,t+spb,.06,musG)}
    if(st==0){tone(73.4,t,spb*30,'sine',.14,musG);tone(110,t,spb*30,'sine',.06,musG)}
    if(S&&S.waveOn&&state=='play'){const pat=[1,0,0,0,0,0,.6,0,1,0,0,.5,0,0,.4,.4];const v=pat[st%16];if(v){tone(100,t,.45,'sine',.55*v,musG,.45);noise(t,.06,.15*v,'lowpass',600,musG)}}
    nextN+=spb;stepN++}}

/* ---------- simulation (équilibrage) ---------- */
function bestSpot(k){const st=CL[k].base,r=st.range*.92,pts=[];for(let d=0;d<PLEN;d+=5){const p=posAt(d);if(p[0]>0&&p[0]<W)pts.push(p)}
  let best=null,bs=-1;for(let y=SKY+20;y<H-4;y+=4)for(let x=8;x<W-8;x+=4){if(!canPlace(x,y))continue;let s=0;for(const p of pts)if((p[0]-x)**2+((p[1]-y)/.6)**2<r*r)s++;if(s>bs){bs=s;best=[x,y]}}return best}
function simulate(li,opt={}){const keep=JSON.stringify(SV);if(opt.deck)SV.deck=opt.deck;if(opt.rank!=null)CORDER.forEach(k=>SV.rank[k]=opt.rank);
  reset(li);S.sim=1;state='play';if(opt.endless){S.N=Infinity;S.endless=true}const deck=SV.deck.filter(Boolean);let tt=0,bi=0;const brs=opt.br||{};
  while(state=='play'&&tt<(opt.endless?9000:3600)){
    if(((tt*2)|0)!=(((tt-1/30)*2)|0)){
      const nT=S.towers.length,want=deck[bi%deck.length],max=opt.maxT||12;
      const ups=S.towers.filter(t=>t.l<MAXLV).map(t=>({t,b:t.l?t.b:(brs[t.k]??(S.towers.indexOf(t)%2)),c:0}));ups.forEach(u=>u.c=upCost(u.t,u.b));ups.sort((a,b)=>a.c-b.c);const cu=ups[0];
      if(nT<max&&S.gold>=CL[want].cost&&(!cu||nT<4||S.gold>cu.c*1.5||nT<S.wave/2)){const p=bestSpot(want);if(p){build(p[0],p[1],want);bi++}}
      else if(cu&&S.gold>=cu.c)upgrade(cu.t,cu.b);
      if(!S.queue.length&&!S.enemies.length&&S.wave<S.N)startWave();
    }
    update(1/30);tt+=1/30}
  const r={lvl:li+1,res:S.result||'timeout',wave:S.wave,lives:S.lives,units:S.towers.map(t=>t.k.slice(0,3)+(t.b<0?'':t.b)+t.l).join(' ')};
  SV=JSON.parse(keep);state='title';return r}

/* ---------- démarrage ---------- */
let ld=0;const ready=()=>{if(++ld==3)boot()};AIMG.onload=ready;AIMG2.onload=ready;FXIMG.onload=ready;AIMG.src=ATLAS;AIMG2.src=ATLAS2;FXIMG.src=FXATLAS;
function boot(){
buildOni();buildUnits();buildIcons();buildUiIcons();makeIcons();
reset(0);fit();initGL();
{let i=1;const step=()=>{if(i<LEVELS.length){getLevel(i);i++;if($('#levels').classList.contains('show')){if(i-1==wSel)goLevelsCard()}setTimeout(step,30)}};setTimeout(step,300)}
goTitle();
let last=performance.now(),acc=0,fc=0;
let bossK='';
function bossUI(){const b=state=='play'&&S.enemies.find(e=>e.o.boss&&!e.dead),k=b?b.type+(b.hp/b.max*100|0):'';if(k==bossK)return;bossK=k;
  $('#bossBar').classList.toggle('show',!!b);if(b){$('#bossName').textContent=b.o.name;$('#bossFill').style.width=Math.max(0,b.hp/b.max*100)+'%'}}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;bossUI();
  if(state!='play'&&state!='over'){S.night=0;S.t+=dt}
  update(dt);if(state!='menu'||true)render(now/1000);music();
  acc+=dt;fc++;if(acc>2){const fps=fc/acc;if(fps<40&&steps>6)steps-=2;else if(fps>57&&steps<12)steps+=2;acc=0;fc=0}
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
window.KIMON={get S(){return S},get SV(){return SV},set SV(v){SV=v},build,canPlace,bestSpot,startWave,startLevel,upgrade,simulate,vfx,FXM,goChests,goLevels,goTeam,openCard,LEVELS,getLevel,save,SPR,USPR,CL};
}
